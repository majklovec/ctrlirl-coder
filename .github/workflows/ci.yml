name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  # Pure-Go tier: packages with no cgo in their dependency graph. No GStreamer
  # and no CERALIVE needed.
  pure-go:
    name: Test pure-Go (vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # cgo-free set: balancer, config, controller, metrics, rpc, scene,
      # server, sinks, sinks/srtla. (compositor/gstutil/gstpull/layer/sinks/srt
      # pull in GStreamer + the SRT fork and run in the dist-amd64 job.)
      - name: go vet (pure-Go set)
        run: go vet ./internal/balancer/... ./internal/config ./internal/controller ./internal/metrics ./internal/rpc ./internal/scene ./internal/server ./internal/sinks ./internal/sinks/srtla
      - name: go test (pure-Go set)
        run: go test ./internal/balancer/... ./internal/config ./internal/controller ./internal/metrics ./internal/rpc ./internal/scene ./internal/server ./internal/sinks ./internal/sinks/srtla

  # TypeScript bindings tier: unit tests + typecheck. The binary-spawning
  # integration test skips when the Go binary is absent, so no GStreamer build
  # is needed here.
  bindings:
    name: Test TS bindings (bun test, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install
        run: bun install --frozen-lockfile
        working-directory: bindings
      - name: bun test
        run: bun test
        working-directory: bindings
      - name: typecheck
        run: bun run typecheck
        working-directory: bindings

  # Native amd64: build the CERALIVE SRT bundle + binary, run the full test
  # suite (go test, SRT stream, integration smoke), build the .deb, publish.
  dist-amd64:
    name: Build + test amd64, publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEB_VERSION: "0.9.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install GStreamer dev + plugins + CERALIVE build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ cmake pkg-config git dpkg-dev \
            libglib2.0-dev libgnutls28-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-x
      - name: Build binary (CERALIVE bundle + embedded identity)
        run: make dist-amd64
      - name: Vet + test (full suite against the fork)
        run: |
          make vet
          make test
      - name: SRT stream test (full pipeline vs local listener)
        run: bash scripts/test-stream.sh
      - name: Integration smoke (layered + full pipelines vs local srtsrc)
        run: bash scripts/integration-smoke.sh
      - name: Build amd64 .deb
        run: bash scripts/build-deb.sh --arch amd64 --version "$DEB_VERSION"
      - name: Upload amd64 .deb for the Pages repo
        uses: actions/upload-artifact@v7
        with:
          name: ctrlirl-coder-debs
          path: dist/ctrlirl-coder_*_amd64.deb
  # arm64 cross-compile: build the CERALIVE fork for arm64, cross-compile the
  # cgo binary against it, smoke it under qemu-user, build the .deb, publish.
  dist-arm64:
    name: Build + test arm64 (cross), publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEB_VERSION: "0.9.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install arm64 cross toolchain + GStreamer + gnuTLS multiarch dev
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cmake pkg-config git dpkg-dev \
            libglib2.0-dev:arm64 \
            libgnutls28-dev:arm64 \
            libgstreamer1.0-dev:arm64 \
            libgstreamer-plugins-base1.0-dev:arm64
          # qemu is optional: only the dry-run smoke needs it (universe
          # availability varies across runner images).
          sudo apt-get install -y --no-install-recommends qemu-user-static \
            || echo "warn: qemu-user-static unavailable; smoke will be skipped"
      - name: Build CERALIVE SRT bundle (arm64 cross)
        run: bash scripts/build-ceralive-srt.sh --arch arm64 --out "$PWD/.build/ceralive-srt/arm64"
      - name: Cross-compile arm64 binary against the fork
        run: |
          # Absolute paths: cgo compiles in a temp dir, so relative -I/-L
          # would resolve nowhere (srt/srt.h: No such file or directory).
          BUNDLE="$PWD/.build/ceralive-srt/arm64"
          sha=$(sed -n 's/.*"lib_sha256": "\([0-9a-f]*\)".*/\1/p' "$BUNDLE/build.json")
          src=$(sed -n 's/.*"source_sha": "\([0-9a-f]*\)".*/\1/p' "$BUNDLE/build.json")
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
            CGO_CFLAGS="-I$BUNDLE/include" \
            CGO_LDFLAGS="-L$BUNDLE/lib -lsrt -Wl,-rpath,\$$ORIGIN -Wl,--enable-new-dtags" \
            go build -ldflags "-X ctrlirl-coder/internal/sinks/srt.ceraliveLibSHA256=$sha -X ctrlirl-coder/internal/sinks/srt.ceraliveSourceSHA=$src" \
            -o bin/ctrlirl-coder-linux-arm64 ./cmd/ctrlirl-coder
          libfile=$(sed -n 's/.*"lib_file": "\([^"]*\)".*/\1/p' "$BUNDLE/build.json"); cp "$BUNDLE/$libfile" bin/arm64-libsrt.so.1.5
          cp "$BUNDLE/build.json" bin/arm64-build.json
      - name: Smoke test under qemu-user (boot, CERALIVE guard, contract)
        run: |
          if ! command -v qemu-aarch64-static >/dev/null 2>&1; then
            echo "qemu-user-static not available; skipping dry-run smoke"
            exit 0
          fi
          # The binary loads the bundled libsrt via $ORIGIN — lib must sit
          # next to the binary. Full-pipeline runs are too slow under
          # qemu-user emulation; --dry-run validates start, SRT backend
          # SHA guard, config/scene/pipeline contract.
          cp bin/arm64-libsrt.so.1.5 bin/libsrt.so.1.5
          qemu-aarch64-static -L /usr/aarch64-linux-gnu \
            ./bin/ctrlirl-coder-linux-arm64 \
            --config config.toml \
            --pipeline pipeline/example-full.pipeline \
            --scene scene.example.json \
            --dry-run
      - name: Build arm64 .deb
        run: bash scripts/build-deb.sh --arch arm64 --version "$DEB_VERSION"
      - name: Upload arm64 .deb for the Pages repo
        uses: actions/upload-artifact@v7
        with:
          name: ctrlirl-coder-debs
          path: dist/ctrlirl-coder_*_arm64.deb

  # Deb package repo (GitHub Pages): publish .debs as a static apt-style
  # repository with two components, always in a single Pages deploy (a
  # Pages deploy replaces the whole site, so both components must go out
  # together):
  #
  #   main     — release debs (tag versions, e.g. 1.0.3-1), from the
  #              latest Release run that cut a tag
  #   main-ci  — per-push CI debs (0.9.<run-number>-1), from the current
  #              (workflow_run: latest successful) CI push to main
  #
  #   deb [trusted=yes] https://majklovec.github.io/ctrlirl-coder/deb/dists main main-ci
  #
  # Unsigned: consumers add the repo with [trusted=yes]. Both components are
  # monotonic (semver tag / run number), so `apt upgrade` tracks the newest
  # of each.
  #
  # Triggers: every green CI push to main, and every successful Release
  # workflow run. Requires: Settings > Pages > Source = "GitHub Actions".
  package-repo:
    name: Publish deb package repo to Pages
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow == 'Release' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       needs.pure-go.result == 'success' &&
       needs.bindings.result == 'success' &&
       (needs.dist-amd64.result == 'success' || needs.dist-amd64.result == 'skipped') &&
       (needs.dist-arm64.result == 'success' || needs.dist-arm64.result == 'skipped'))
    needs: [pure-go, bindings, dist-amd64, dist-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve debs to publish
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_run') {
              // Release run: publish only when it cut a tag.
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              });
              const versionJob = jobs.data.jobs.find(j => j.name === 'version');
              const newTag = versionJob?.steps
                .find(s => s.name === 'Detect release tag' && s.conclusion === 'success')
                ?.outputs?.new_tag;
              if (!newTag) {
                core.info('Release run cut no tag — skipping the Pages repo.');
                core.setOutput('skip', 'true');
                return;
              }
              core.setOutput('source_run_id', String(context.payload.workflow_run.id));
            } else {
              // CI push: main-ci from this run; main from the latest
              // successful Release run that cut a tag.
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'release.yml',
                  branch: 'main',
                  status: 'completed',
                  per_page: 100,
                }
              );
              let latestTag = '';
              for (const run of runs) {
                if (run.conclusion !== 'success') continue;
                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const versionJob = jobs.data.jobs.find(j => j.name === 'version');
                const tag = versionJob?.steps
                  .find(s => s.name === 'Detect release tag' && s.conclusion === 'success')
                  ?.outputs?.new_tag;
                if (tag) { latestTag = tag; core.setOutput('source_run_id', String(run.id)); break; }
              }
              if (!latestTag) {
                core.info('No release with a tag found — main component skipped.');
              }
            }
            core.setOutput('skip', 'false');
      - if: steps.resolve.outputs.skip == 'true'
        name: Skip
        run: echo "Nothing to publish."
      - if: steps.resolve.outputs.skip == 'false'
        name: Install dpkg packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.source_run_id != ''
        name: Download release debs (amd64)
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.resolve.outputs.source_run_id }}
          name: ctrlirl-coder-amd64
          path: debs/main
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.source_run_id != ''
        name: Download release debs (arm64)
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.resolve.outputs.source_run_id }}
          name: ctrlirl-coder-arm64
          path: debs/main
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.ci_run_id != ''
        name: Download latest CI debs (main component companion)
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.resolve.outputs.ci_run_id }}
          name: ctrlirl-coder-debs
          path: debs/main
      - if: steps.resolve.outputs.skip == 'false' && github.event_name == 'push'
        name: Download this run's CI debs (main-ci)
        uses: actions/download-artifact@v7
        with:
          name: ctrlirl-coder-debs
          path: debs/main-ci
      - if: steps.resolve.outputs.skip == 'false'
        name: Build apt repo (main + main-ci)
        run: |
          set -euo pipefail
          build() {
            local comp=$1 srcdir=$2 desc=$3
            local SITE="site/deb/dists/$1"
            [ -d "$srcdir" ] || { echo "no debs for $1 — skipping component"; return 0; }
            mkdir -p "$SITE/binary-amd64" "$SITE/binary-arm64"
            for f in "$srcdir"/*.deb; do
              [ -e "$f" ] || continue
              arch=$(dpkg-deb -f "$f" Architecture)
              cp "$f" "$SITE/binary-$arch/"
            done
            (
              cd "$SITE"
              dpkg-scanpackages --multiversion . . /dev/null > Packages
              gzip -9kf Packages
            )
            cat > "$SITE/Release" <<RELEASE
          Origin: CtrlIRL
          Label: ctrlirl-coder
          Suite: stable
          Codename: $1
          Architectures: amd64 arm64
          Components: $1
          Description: $desc
          RELEASE
            echo "Date: $(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> "$SITE/Release"
          }
          build main debs/main "CtrlIRL-Coder live SRT encoder (releases)" || true
          build main-ci debs/main-ci "CtrlIRL-Coder live SRT encoder (CI builds)" || true
          [ -d site/deb/dists/main ] || [ -d site/deb/dists/main-ci ]
          ls -lR site
      - if: steps.resolve.outputs.skip == 'false'
        name: Write site README
        run: |
          cat > site/README.md <<'README'
          # CtrlIRL-Coder — deb package repository

          Two components (both unsigned — add with `[trusted=yes]`):

          | Component | Content | Versioning |
          |---|---|---|
          | `main` | release debs | release tags (e.g. 1.0.3-1) |
          | `main-ci` | every green CI build on main | run number (0.9.N-1) |

          ```sh
          echo "deb [trusted=yes] https://majklovec.github.io/ctrlirl-coder/deb/dists main main-ci"             | sudo tee /etc/apt/sources.list.d/ctrlirl-coder.list
          sudo apt-get update
          sudo apt-get install ctrlirl-coder
          ```

          `sudo apt-get upgrade ctrlirl-coder` follows the newest build of
          each component.
          README
      - if: steps.resolve.outputs.skip == 'false'
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.resolve.outputs.skip == 'false'
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
