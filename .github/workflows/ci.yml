name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"


# One run per commit: a fast-follow push replaces the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Semantic versioning: analyzes conventional commits since the last tag
  # and, when a bump is warranted, prepends the notes to CHANGELOG.md,
  # commits it, and publishes the tag + GitHub release draft. Emits new_tag
  # when the tag lands on HEAD (empty for docs-only commits; semantic-release
  # exits 1 there, so the detect step records it under always()).
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.semver.outputs.new_tag }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install semantic-release + plugins
        run: |
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github

      - name: Semantic versioning (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release@24

      - name: Detect release tag
        if: always()
        id: semver
        run: |
          git fetch --force --tags
          TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          if [ -n "$TAG" ] && [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Release $TAG cut."
          else
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "No version bump needed for this commit — skipping release."
          fi

  # Pure-Go tier: packages with no cgo in their dependency graph. No GStreamer
  # and no CERALIVE needed.
  pure-go:
    name: Test pure-Go (vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # cgo-free set: balancer, config, controller, metrics, rpc, scene,
      # server, sinks, sinks/srtla. (compositor/gstutil/gstpull/layer/sinks/srt
      # pull in GStreamer + the SRT fork and run in the dist-amd64 job.)
      - name: go vet (pure-Go set)
        run: go vet ./internal/balancer/... ./internal/config ./internal/controller ./internal/metrics ./internal/rpc ./internal/scene ./internal/server ./internal/sinks ./internal/sinks/srtla
      - name: go test (pure-Go set)
        run: go test ./internal/balancer/... ./internal/config ./internal/controller ./internal/metrics ./internal/rpc ./internal/scene ./internal/server ./internal/sinks ./internal/sinks/srtla

  # TypeScript bindings tier: unit tests + typecheck. The binary-spawning
  # integration test skips when the Go binary is absent, so no GStreamer build
  # is needed here.
  bindings:
    name: Test TS bindings (bun test, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install
        run: bun install --frozen-lockfile
        working-directory: bindings
      - name: bun test
        run: bun test
        working-directory: bindings
      - name: typecheck
        run: bun run typecheck
        working-directory: bindings

  # Native amd64: build the CERALIVE SRT bundle + binary, run the full test
  # suite (go test, SRT stream, integration smoke), build the .deb, publish.
  dist-amd64:
    name: Build + test amd64, publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: version
    runs-on: ubuntu-latest
    env:
      DEB_VERSION: "0.9.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v7
      - name: Check release result (skip when the release already built+tested)
        id: skip-check
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            // The Release job (this run) owns builds for tagged commits.
            // If it already finished successfully, the full GStreamer test
            // suite ran there — skip the duplicate CI build. Otherwise
            // (no bump, release in flight, or release failed) build here.
            const pick = (r, keys) => {
              let v = r;
              for (const k of keys) { if (v && !Array.isArray(v)) v = v[k]; }
              return Array.isArray(v) ? v : [];
            };
            const resp = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', event: 'push', branch: 'main',
              status: 'completed', per_page: 100,
            });
            const runs = pick(resp, ['data', 'workflow_runs']);
            for (const run of runs) {
              if (run.head_sha !== context.payload.sha) continue;
              const jobResp = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: run.id, per_page: 100,
              });
              const jobs = pick(jobResp, ['data', 'jobs']);
              const rel = jobs.find(j => j.name === 'Release');
              if (rel && rel.conclusion === 'success') {
                core.info('Release succeeded for this commit — skipping the CI dist build.');
                core.setOutput('do', 'yes');
                return;
              }
              break;
            }
            core.setOutput('do', 'no');
            core.info('Building in CI (no successful release for this commit).');
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install GStreamer dev + plugins + CERALIVE build deps
        if: steps.skip-check.outputs.do == 'no'
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            sleep 30
          done || { echo "apt-get update failed after 3 attempts"; exit 1; }
          for i in 1 2 3; do
            sudo apt-get install -y --no-install-recommends \
            gcc g++ cmake pkg-config git dpkg-dev \
            libglib2.0-dev libgnutls28-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-x && break
            sleep 30
          done || { echo "apt-get install failed after 3 attempts"; exit 1; }

      - name: Build binary (CERALIVE bundle + embedded identity)
        if: steps.skip-check.outputs.do == 'no'
        run: make dist-amd64
      - name: Vet + test (full suite against the fork)
        if: steps.skip-check.outputs.do == 'no'
        run: |
          make vet
          make test
      - name: SRT stream test (full pipeline vs local listener)
        if: steps.skip-check.outputs.do == 'no'
        run: bash scripts/test-stream.sh
      - name: Integration smoke (layered + full pipelines vs local srtsrc)
        if: steps.skip-check.outputs.do == 'no'
        run: bash scripts/integration-smoke.sh
      - name: Build amd64 .deb
        if: steps.skip-check.outputs.do == 'no'
        run: bash scripts/build-deb.sh --arch amd64 --version "$DEB_VERSION"
      - name: Find latest successful release (main component)
        if: steps.skip-check.outputs.do == 'no'
        id: prev-release
        uses: actions/github-script@v9
        with:
          script: |
            const pick = (r, keys) => {
              let v = r;
              for (const k of keys) { if (v && !Array.isArray(v)) v = v[k]; }
              return Array.isArray(v) ? v : [];
            };
            // The `main` component carries the latest *successful*
            // release's debs: a stale/failed run (e.g. a tag cut but the
            // build cancelled by a newer push) never propagates.
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', branch: 'main',
              status: 'completed', per_page: 100,
            });
            for (const run of runs) {
              if (run.conclusion !== 'success') continue;
              const jobResp = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: run.id, per_page: 100,
              });
              const jobs = pick(jobResp, ['data', 'jobs']);
              const versionJob = jobs.find(j => j.name === 'version');
              const tag = versionJob?.steps
                .find(s => s.name === 'Detect release tag' && s.conclusion === 'success')
                ?.outputs?.new_tag;
              if (tag) {
                core.setOutput('run_id', String(run.id));
                core.info(`Latest release: ${tag} (run ${run.id})`);
                return;
              }
            }
            core.info('No successful release with a tag found yet — main component will be empty.');
      - if: steps.prev-release.outputs.run_id != ''
        name: Download latest release .debs (main component)
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.prev-release.outputs.run_id }}
          name: ctrlirl-coder-rel-amd64
          path: repo/main
      - if: steps.prev-release.outputs.run_id != ''
        name: Download latest release .debs arm64 (main component)
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.prev-release.outputs.run_id }}
          name: ctrlirl-coder-rel-arm64
          path: repo/main
      # The repo artifact carries main-ci (this run's debs, at the root)
      # and main (latest successful release debs, under repo/) together,
      # so a single Page deploy always has both components.
      - name: Upload repo artifact (main-ci + main)
        if: steps.skip-check.outputs.do == 'no'
        uses: actions/upload-artifact@v7
        with:
          name: ctrlirl-coder-repo
          path: |
            dist/ctrlirl-coder_*_amd64.deb
            repo/
  # arm64 cross-compile: build the CERALIVE fork for arm64, cross-compile the
  # cgo binary against it, smoke it under qemu-user, build the .deb, publish.
  dist-arm64:
    name: Build + test arm64 (cross), publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: version
    runs-on: ubuntu-latest
    env:
      DEB_VERSION: "0.9.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v7
      - name: Check release result (skip when the release already built+tested)
        id: skip-check
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            // The Release job (this run) owns builds for tagged commits.
            // If it already finished successfully, the full GStreamer test
            // suite ran there — skip the duplicate CI build. Otherwise
            // (no bump, release in flight, or release failed) build here.
            const pick = (r, keys) => {
              let v = r;
              for (const k of keys) { if (v && !Array.isArray(v)) v = v[k]; }
              return Array.isArray(v) ? v : [];
            };
            const resp = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', event: 'push', branch: 'main',
              status: 'completed', per_page: 100,
            });
            const runs = pick(resp, ['data', 'workflow_runs']);
            for (const run of runs) {
              if (run.head_sha !== context.payload.sha) continue;
              const jobResp = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: run.id, per_page: 100,
              });
              const jobs = pick(jobResp, ['data', 'jobs']);
              const rel = jobs.find(j => j.name === 'Release');
              if (rel && rel.conclusion === 'success') {
                core.info('Release succeeded for this commit — skipping the CI dist build.');
                core.setOutput('do', 'yes');
                return;
              }
              break;
            }
            core.setOutput('do', 'no');
            core.info('Building in CI (no successful release for this commit).');
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install arm64 cross toolchain + GStreamer + gnuTLS multiarch dev
        if: steps.skip-check.outputs.do == 'no'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cmake pkg-config git dpkg-dev \
            libglib2.0-dev:arm64 \
            libgnutls28-dev:arm64 \
            libgstreamer1.0-dev:arm64 \
            libgstreamer-plugins-base1.0-dev:arm64
          # qemu is optional: only the dry-run smoke needs it (universe
          # availability varies across runner images).
          sudo apt-get install -y --no-install-recommends qemu-user-static \
            || echo "warn: qemu-user-static unavailable; smoke will be skipped"
      - name: Build CERALIVE SRT bundle (arm64 cross)
        if: steps.skip-check.outputs.do == 'no'
        run: bash scripts/build-ceralive-srt.sh --arch arm64 --out "$PWD/.build/ceralive-srt/arm64"
      - name: Cross-compile arm64 binary against the fork
        if: steps.skip-check.outputs.do == 'no'
        run: |
          # Absolute paths: cgo compiles in a temp dir, so relative -I/-L
          # would resolve nowhere (srt/srt.h: No such file or directory).
          BUNDLE="$PWD/.build/ceralive-srt/arm64"
          sha=$(sed -n 's/.*"lib_sha256": "\([0-9a-f]*\)".*/\1/p' "$BUNDLE/build.json")
          src=$(sed -n 's/.*"source_sha": "\([0-9a-f]*\)".*/\1/p' "$BUNDLE/build.json")
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
            CGO_CFLAGS="-I$BUNDLE/include" \
            RPATH='$ORIGIN' \
            CGO_LDFLAGS="-L$BUNDLE/lib -lsrt -Wl,-rpath,$RPATH -Wl,--enable-new-dtags" \
            go build -ldflags "-X ctrlirl-coder/internal/sinks/srt.ceraliveLibSHA256=$sha -X ctrlirl-coder/internal/sinks/srt.ceraliveSourceSHA=$src" \
            -o bin/ctrlirl-coder-linux-arm64 ./cmd/ctrlirl-coder
          libfile=$(sed -n 's/.*"lib_file": "\([^"]*\)".*/\1/p' "$BUNDLE/build.json"); cp "$BUNDLE/$libfile" bin/arm64-libsrt.so.1.5
          cp "$BUNDLE/build.json" bin/arm64-build.json
      - name: Smoke test under qemu-user (boot, CERALIVE guard, contract)
        if: steps.skip-check.outputs.do == 'no'
        run: |
          if ! command -v qemu-aarch64-static >/dev/null 2>&1; then
            echo "qemu-user-static not available; skipping dry-run smoke"
            exit 0
          fi
          # The binary loads the bundled libsrt via $ORIGIN — lib must sit
          # next to the binary. Full-pipeline runs are too slow under
          # qemu-user emulation; --dry-run validates start, SRT backend
          # SHA guard, config/scene/pipeline contract.
          cp bin/arm64-libsrt.so.1.5 bin/libsrt.so.1.5
          qemu-aarch64-static -L /usr/aarch64-linux-gnu \
            ./bin/ctrlirl-coder-linux-arm64 \
            --config config.toml \
            --pipeline pipeline/example-full.pipeline \
            --scene scene.example.json \
            --dry-run
      - name: Build arm64 .deb
        if: steps.skip-check.outputs.do == 'no'
        run: bash scripts/build-deb.sh --arch arm64 --version "$DEB_VERSION"
      - if: steps.skip-check.outputs.do == 'no'
        name: Upload CI arm64 deb
        uses: actions/upload-artifact@v7
        with:
          name: ctrlirl-coder-ci-arm64
          path: dist/ctrlirl-coder_*_arm64.deb
          if-no-files-found: error
      # The main component is refreshed by the amd64 job (it downloads both
      # per-arch release .debs and uploads the combined repo artifact).

  # Deb package repo (GitHub Pages): publish .debs as a static apt-style
  # repository with two components, always in a single Pages deploy (a
  # Pages deploy replaces the whole site, so both components must go out
  # together):
  #
  #   main     — release debs (tag versions, e.g. 1.0.3-1), from the
  #              latest Release run that cut a tag
  #   main-ci  — per-push CI debs (0.9.<run-number>-1), from the current
  #              (workflow_run: latest successful) CI push to main
  #
  #   deb [trusted=yes] https://majklovec.github.io/ctrlirl-coder/deb/dists main main-ci
  #
  # Unsigned: consumers add the repo with [trusted=yes]. Both components are
  # monotonic (semver tag / run number), so `apt upgrade` tracks the newest
  # of each.
  #
  # Triggers: every green CI push to main, and every successful Release
  # workflow run. Requires: Settings > Pages > Source = "GitHub Actions".
  package-repo:
    name: Publish deb package repo to Pages
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow == 'ci.yml' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       needs.pure-go.result == 'success' &&
       needs.bindings.result == 'success' &&
       (needs.dist-amd64.result == 'success' || needs.dist-amd64.result == 'skipped') &&
       (needs.dist-arm64.result == 'success' || needs.dist-arm64.result == 'skipped'))
    needs: [pure-go, bindings, dist-amd64, dist-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve debs to publish
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_run') {
              // Release run: publish its debs under main (and main-ci)
              // only when it cut a tag.
              const pick = (r, keys) => {
                let v = r;
                for (const k of keys) { if (v && !Array.isArray(v)) v = v[k]; }
                return Array.isArray(v) ? v : [];
              };
              const jobs = pick(await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              }), ['data', 'jobs']);
              const versionJob = jobs.find(j => j.name === 'version');
              const newTag = versionJob?.steps
                .find(s => s.name === 'Detect release tag' && s.conclusion === 'success')
                ?.outputs?.new_tag;
              if (!newTag) {
                core.info('Release run cut no tag — skipping the Pages repo.');
                core.setOutput('skip', 'true');
                return;
              }
              core.setOutput('mode', 'release');
            } else {
              // CI push: the dist-amd64 job already combined this run's
              // debs (main-ci) with the latest successful release's debs
              // (main) in one artifact — no run discovery needed here.
              core.setOutput('mode', 'ci');
            }
            core.setOutput('skip', 'false');
      - if: steps.resolve.outputs.skip == 'true'
        name: Skip
        run: echo "Nothing to publish."
      - if: steps.resolve.outputs.skip == 'false'
        name: Install dpkg packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'ci'
        name: Download repo artifact (main-ci + main)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: ctrlirl-coder-repo
          path: repo-src
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'ci'
        name: Download CI arm64 deb
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: ctrlirl-coder-ci-arm64
          path: deb-ci-arm64
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'ci'
        name: Split repo artifact into components
        run: |
          set -euo pipefail
          mkdir -p debs/main-ci debs/main
          # root files = this run amd64 (main-ci); repo/ = latest release (main)
          if [ -d repo-src ]; then
            find repo-src -maxdepth 1 -name '*.deb' -exec cp {} debs/main-ci/ \;
          fi
          if [ -d deb-ci-arm64 ]; then cp -n deb-ci-arm64/*.deb debs/main-ci/; fi
          if [ -d repo-src/repo ]; then
            find repo-src/repo -name '*.deb' -exec cp {} debs/main/ \;
            find repo-src/repo -name '*.deb' -exec cp -n {} debs/main-ci/ \;
          else
            echo "(no earlier release — main mirrors main-ci)"
            cp -n debs/main-ci/*.deb debs/main/
          fi
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'release'
        name: Download release debs (amd64)
        uses: actions/download-artifact@v7
        with:
          name: ctrlirl-coder-rel-amd64
          path: debs/main
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'release'
        name: Download release debs (arm64)
        uses: actions/download-artifact@v7
        with:
          name: ctrlirl-coder-rel-arm64
          path: debs/main
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'release'
        name: Copy release debs to main-ci
        run: |
          set -euo pipefail
          mkdir -p debs/main-ci
          cp debs/main/*.deb debs/main-ci/
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'release'
        name: Download release tarballs (binaries)
        uses: actions/download-artifact@v7
        with:
          name: ctrlirl-coder-bin-amd64
          path: pkgs-amd64
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'release'
        name: Download release tarballs (arm64)
        uses: actions/download-artifact@v7
        with:
          name: ctrlirl-coder-bin-arm64
          path: pkgs-arm64
      - if: steps.resolve.outputs.skip == 'false' && steps.resolve.outputs.mode == 'release'
        name: Extract release binaries to /bin
        run: |
          set -euo pipefail
          mkdir -p site/bin
          for arch in amd64 arm64; do
            tgz=$(ls "pkgs-$arch"/*-linux-$arch.tar.gz 2>/dev/null | head -1)
            [ -n "$tgz" ] || { echo "no $arch tarball — skipping"; continue; }
            tar -xzf "$tgz" -C /tmp
            ver=$(basename "$tgz" | sed -E "s/ctrlirl-coder-([^-]+)-linux-.*\.tar\.gz/\1/")
            cp /tmp/ctrlirl-coder/ctrlirl-coder-linux-$arch "site/bin/ctrlirl-coder-$ver-linux-$arch"
            cp /tmp/ctrlirl-coder/libsrt.so.1.5 "site/bin/libsrt-$ver.so.1.5"
            cp /tmp/ctrlirl-coder/build.json "site/bin/build-$ver.json"
            rm -rf /tmp/ctrlirl-coder
          done
          ls -l site/bin
      - if: steps.resolve.outputs.skip == 'false'
        name: Build apt repo (main + main-ci)
        run: |
          set -euo pipefail
          build() {
            local comp=$1 srcdir=$2 desc=$3
            local SITE="site/deb/dists/$1"
            [ -d "$srcdir" ] || { echo "no debs for $1 — skipping component"; return 0; }
            mkdir -p "$SITE/binary-amd64" "$SITE/binary-arm64"
            for f in "$srcdir"/*.deb; do
              [ -e "$f" ] || continue
              arch=$(dpkg-deb -f "$f" Architecture)
              cp "$f" "$SITE/binary-$arch/"
            done
            (
              cd "$SITE"
              dpkg-scanpackages --multiversion . . /dev/null > Packages
              gzip -9kf Packages
            )
            cat > "$SITE/Release" <<RELEASE
          Origin: CtrlIRL
          Label: ctrlirl-coder
          Suite: stable
          Codename: $1
          Architectures: amd64 arm64
          Components: $1
          Description: $desc
          RELEASE
            echo "Date: $(date -u '+%a, %d %b %Y %H:%M:%S UTC')" >> "$SITE/Release"
          }
          build main debs/main "CtrlIRL-Coder live SRT encoder (releases)" || true
          build main-ci debs/main-ci "CtrlIRL-Coder live SRT encoder (CI builds)" || true
          [ -d site/deb/dists/main ] || [ -d site/deb/dists/main-ci ]
          ls -lR site
      - if: steps.resolve.outputs.skip == 'false'
        name: Write index.html (.deb list)
        run: |
          set -euo pipefail
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<title>CtrlIRL-Coder — deb packages</title>'
            echo '<style>'
            echo 'body{font-family:system-ui,sans-serif;margin:2rem;max-width:64rem}'
            echo 'table{border-collapse:collapse;width:100%}'
            echo 'th,td{border:1px solid #ccc;padding:.4rem .7rem;text-align:left}'
            echo 'th{background:#f2f2f2}'
            echo 'pre{background:#f6f6f6;padding:.8rem;overflow-x:auto}'
            echo 'a{color:#0366d6}'
            echo '</style></head><body>'
            echo '<h1>CtrlIRL-Coder — deb packages</h1>'
            echo '<p>Static apt-style repository (unsigned — <code>[trusted=yes]</code>), published by the CI <code>package-repo</code> job.</p>'
            echo '<h2>Package components</h2>'
            echo '<table><tr><th>Component</th><th>Content</th><th>Versioning</th></tr>'
            echo '<tr><td>main</td><td>release debs</td><td>release tags (e.g. 1.0.3-1)</td></tr>'
            echo '<tr><td>main-ci</td><td>every green CI build on main</td><td>run number (0.9.N-1)</td></tr></table>'
            echo '<h2>Add the repository</h2>'
            echo '<pre>deb [trusted=yes] https://majklovec.github.io/ctrlirl-coder/deb/dists main main-ci</pre>'
            echo '<h2>Debs</h2>'
            echo '<table><tr><th>Version</th><th>Component</th><th>Architecture</th><th>Size</th><th>File</th></tr>'
            for comp in main main-ci; do
              for f in "site/deb/dists/$comp"/binary-*/*.deb; do
                [ -e "$f" ] || continue
                arch=$(basename "$(dirname "$f")" | sed 's/^binary-//')
                ver=$(dpkg-deb -f "$f" Version 2>/dev/null || basename "$f" | sed -E 's/^ctrlirl-coder_(.*)_[a-z0-9]+\.deb$/\1/')
                size=$(( $(stat -c %s "$f") / 1024 ))
                rel=${f#site/}
                echo "<tr><td>$ver</td><td>$comp</td><td>$arch</td><td>${size} KiB</td><td><a href=\"$rel\">$rel</a></td></tr>"
              done
            done
            echo '</table>'
            echo '<h2>Release binaries (latest)</h2>'
            echo '<p>Each binary needs <code>libsrt-&lt;ver&gt;.so.1.5</code> next to it (CERALIVE SRT fork, identity in <code>build-&lt;ver&gt;.json</code>).</p>'
            echo '<table><tr><th>Version</th><th>Architecture</th><th>Size</th><th>File</th></tr>'
            for f in site/bin/ctrlirl-coder-*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              # only release-named binaries (ctrlirl-coder-<ver>-linux-<arch>)
              if ! [[ $base =~ ^ctrlirl-coder-([^-]+)-linux-([a-z0-9]+)$ ]]; then
                continue
              fi
              ver=${BASH_REMATCH[1]}
              arch=${BASH_REMATCH[2]}
              size=$(( $(stat -c %s "$f") / 1024 ))
              echo "<tr><td>$ver</td><td>$arch</td><td>${size} KiB</td><td><a href=\"bin/$base\">bin/$base</a></td></tr>"
            done
            echo '</table>'
            echo '</body></html>'
          } > site/index.html
          head -30 site/index.html
      - if: steps.resolve.outputs.skip == 'false'
        name: Write site README
        run: |
          cat > site/README.md <<'README'
          # CtrlIRL-Coder — deb package repository

          Two components (both unsigned — add with `[trusted=yes]`):

          | Component | Content | Versioning |
          |---|---|---|
          | `main` | release debs | release tags (e.g. 1.0.3-1) |
          | `main-ci` | every green CI build on main | run number (0.9.N-1) |

          ```sh
          echo "deb [trusted=yes] https://majklovec.github.io/ctrlirl-coder/deb/dists main main-ci"             | sudo tee /etc/apt/sources.list.d/ctrlirl-coder.list
          sudo apt-get update
          sudo apt-get install ctrlirl-coder
          ```

          `sudo apt-get upgrade ctrlirl-coder` follows the newest build of
          each component.
          README
      - if: steps.resolve.outputs.skip == 'false'
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - if: steps.resolve.outputs.skip == 'false'
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Release: attach the per-arch payloads (debs + binaries + CERALIVE lib)
  # to the semantic-release draft. Runs only when the version job cut a tag
  # for this commit.
  release:
    name: Release
    if: needs.version.outputs.new_tag != ''
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install GStreamer dev + plugins + CERALIVE build deps
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            sleep 30
          done || { echo "apt-get update failed after 3 attempts"; exit 1; }
          for i in 1 2 3; do
            sudo apt-get install -y --no-install-recommends \
            gcc g++ cmake pkg-config git dpkg-dev \
            libglib2.0-dev libgnutls28-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-x && break
            sleep 30
          done || { echo "apt-get install failed after 3 attempts"; exit 1; }

      - name: Build amd64 binary (CERALIVE bundle + embedded identity)
        run: make dist-amd64

      - name: Vet + test amd64 (full suite against the fork)
        run: |
          make vet
          make test

      - name: SRT stream test (full pipeline vs local listener)
        run: bash scripts/test-stream.sh

      - name: Integration smoke (layered + full pipelines vs local srtsrc)
        run: bash scripts/integration-smoke.sh

      - name: Build amd64 .deb
        run: bash scripts/build-deb.sh --arch amd64 --version "${{ needs.version.outputs.new_tag }}"

      - name: Package amd64 release tarball (binary + CERALIVE lib)
        run: |
          set -euo pipefail
          mkdir -p dist/pkg-amd64/ctrlirl-coder
          cp bin/ctrlirl-coder-linux-amd64 dist/pkg-amd64/ctrlirl-coder/
          cp bin/libsrt.so.1.5 dist/pkg-amd64/ctrlirl-coder/libsrt.so.1.5
          cp bin/build.json dist/pkg-amd64/ctrlirl-coder/
          tar -C dist/pkg-amd64 -czf "dist/ctrlirl-coder-${TAG#v}-linux-amd64.tar.gz" ctrlirl-coder
        env:
          TAG: ${{ needs.version.outputs.new_tag }}

      - name: Build + test arm64 (cross-compile)
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libglib2.0-dev:arm64 libgnutls28-dev:arm64 \
            libgstreamer1.0-dev:arm64 libgstreamer-plugins-base1.0-dev:arm64
          bash scripts/build-ceralive-srt.sh --arch arm64 --out "$PWD/.build/ceralive-srt/arm64"
          BUNDLE="$PWD/.build/ceralive-srt/arm64"
          sha=$(sed -n 's/.*"lib_sha256": "\([0-9a-f]*\)\.*/\1/p' "$BUNDLE/build.json")
          src=$(sed -n 's/.*"source_sha": "\([0-9a-f]*\)$.*/\1/p' "$BUNDLE/build.json")
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
            CGO_CFLAGS="-I$BUNDLE/include" \
            RPATH='$ORIGIN' \
            CGO_LDFLAGS="-L$BUNDLE/lib -lsrt -Wl,-rpath,$RPATH -Wl,--enable-new-dtags" \
            go build -ldflags "-X ctrlirl-coder/internal/sinks/srt.ceraliveLibSHA256=$sha -X ctrlirl-coder/internal/sinks/srt.ceraliveSourceSHA=$src" \
            -o bin/ctrlirl-coder-linux-arm64 ./cmd/ctrlirl-coder
          libfile=$(sed -n 's/.*"lib_file": "\([^"]*\)".*/\1/p' "$BUNDLE/build.json"); cp "$BUNDLE/$libfile" bin/arm64-libsrt.so.1.5
          cp "$BUNDLE/build.json" bin/arm64-build.json

      - name: Build arm64 .deb
        run: bash scripts/build-deb.sh --arch arm64 --version "${{ needs.version.outputs.new_tag }}"

      - name: Package arm64 release tarball (binary + CERALIVE lib)
        run: |
          set -euo pipefail
          mkdir -p dist/pkg-arm64/ctrlirl-coder
          cp bin/ctrlirl-coder-linux-arm64 dist/pkg-arm64/ctrlirl-coder/
          cp bin/arm64-libsrt.so.1.5 dist/pkg-arm64/ctrlirl-coder/libsrt.so.1.5
          cp bin/arm64-build.json dist/pkg-arm64/ctrlirl-coder/build.json
          tar -C dist/pkg-arm64 -czf "dist/ctrlirl-coder-${TAG#v}-linux-arm64.tar.gz" ctrlirl-coder
        env:
          TAG: ${{ needs.version.outputs.new_tag }}

      - name: Upload debs (amd64)
        uses: actions/upload-artifact@v7
        with:
          name: ctrlirl-coder-rel-amd64
          path: dist/ctrlirl-coder_*_amd64.deb
      - name: Upload debs (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: ctrlirl-coder-rel-arm64
          path: dist/ctrlirl-coder_*_arm64.deb
      - name: Upload tarballs (amd64)
        uses: actions/upload-artifact@v7
        with:
          name: ctrlirl-coder-bin-amd64
          path: dist/ctrlirl-coder-*-linux-amd64.tar.gz
      - name: Upload tarballs (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: ctrlirl-coder-bin-arm64
          path: dist/ctrlirl-coder-*-linux-arm64.tar.gz

      - name: Download release payloads (debs)
        uses: actions/download-artifact@v8
        with:
          name: ctrlirl-coder-rel-amd64
          path: artifacts
      - name: Download release payloads (debs arm64)
        uses: actions/download-artifact@v8
        with:
          name: ctrlirl-coder-rel-arm64
          path: artifacts
      - name: Download release payloads (tarballs)
        uses: actions/download-artifact@v8
        with:
          name: ctrlirl-coder-bin-amd64
          path: artifacts
      - name: Download release payloads (tarballs arm64)
        uses: actions/download-artifact@v8
        with:
          name: ctrlirl-coder-bin-arm64
          path: artifacts

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: Release ${{ needs.version.outputs.new_tag }}
          files: artifacts/*
          token: ${{ secrets.GITHUB_TOKEN }}
