<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Bouncing Ball</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    canvas {
            margin: 0;
      background-color: #f0f0f0;
    }
  </style>
</head>

<body>

  <canvas id="gameCanvas" width="1920" height="1080"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Ball properties
    const BALL_COUNT = 8;
    const COLORS = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#a55eea', '#ff6b81', '#7bed9f', '#70a1ff'];

    function makeBall(index) {
      return {
        x: 50 + Math.random() * (canvas.width - 100),
        y: 50 + Math.random() * (canvas.height - 100),
        radius: 10 + Math.random() * 15,
        vx: (2 + Math.random() * 4) * (Math.random() < 0.5 ? -1 : 1),
        vy: (2 + Math.random() * 4) * (Math.random() < 0.5 ? -1 : 1),
        color: COLORS[index % COLORS.length]
      };
    }

    const balls = Array.from({ length: BALL_COUNT }, (_, i) => makeBall(i));

    const SAFE_TITLE = 0.90; // 90% title safe
    const SAFE_ACTION = 0.80; // 80% action safe

    function drawMarks() {
      const W = canvas.width, H = canvas.height;
      ctx.save();

      // Grid: 10 px squares
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      for (let x = 10; x < W; x += 10) {
        ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke();
      }
      for (let y = 10; y < H; y += 10) {
        ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 3;
      for (let x = 100; x < W; x += 100) {
        ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke();
      }
      for (let y = 100; y < H; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
      }      

      // Ruler labels every 200 px
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.font = '18px monospace';
      for (let x = 200; x < W; x += 200) ctx.fillText(String(x), x - 14, 22);
      for (let y = 200; y < H; y += 200) ctx.fillText(String(y), 6, y - 6);

      // Center crosshair
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 2;
      const cx = W / 2, cy = H / 2;
      ctx.beginPath();
      ctx.moveTo(cx - 30, cy); ctx.lineTo(cx + 30, cy);
      ctx.moveTo(cx, cy - 30); ctx.lineTo(cx, cy + 30);
      ctx.stroke();

      // Frame border
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, W - 2, H - 2);

      ctx.restore();
    }

    function drawBall(ball) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.fill();
      ctx.closePath();
    }

    function update() {
      // Clear the canvas each frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMarks();

      for (const ball of balls) {
        drawBall(ball);

        // Bounce off left or right walls
        if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
          ball.vx = -ball.vx;
        }

        // Bounce off top or bottom walls
        if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
          ball.vy = -ball.vy;
        }

        // Move the ball
        ball.x += ball.vx;
        ball.y += ball.vy;
      }

      requestAnimationFrame(update);
    }

    // Start the animation loop
    update();
  </script>

</body>

</html>
